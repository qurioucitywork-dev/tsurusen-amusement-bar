name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: e6baa09043fb756e7961f7b835ade231
    defaults:
      run:
        working-directory: tsurusen-amusement-bar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare API token
        id: cloudflare-token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Set repository secret CLOUDFLARE_API_TOKEN to enable automatic Cloudflare Pages deployment."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.cloudflare-token.outputs.available == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        if: steps.cloudflare-token.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tsurusen-amusement-bar/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.cloudflare-token.outputs.available == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build static site
        if: steps.cloudflare-token.outputs.available == 'true'
        run: pnpm run build:cloudflare

      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare-token.outputs.available == 'true'
        run: npx wrangler pages deploy out --project-name tsurusen-amusement-bar --branch master --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
